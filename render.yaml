# Render deployment for the hosted KinderGuard server (web app + desktop
# client-mode backend). Free plan: no card; the instance sleeps after ~15
# minutes without traffic and the first request after sleep can take up to a
# minute. Secrets (MONGO_URI, JWT_SECRET) are entered in the Render dashboard
# (sync: false) and never live in the repo or the installer.
services:
  - type: web
    name: kinderguard-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
